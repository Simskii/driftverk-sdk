name: Test and publish SDK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run

  publish:
    needs: test
    if: github.repository == 'Simskii/driftverk-sdk' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Check whether this version is already published
        id: version
        run: node scripts/check-release.mjs
      - name: Publish new version through npm trusted publishing
        if: steps.version.outputs.publish == 'true'
        run: npm publish
